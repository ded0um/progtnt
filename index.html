<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programme TNT</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --card2: #222633;
        --text: #eef1f6;
        --muted: #9aa3b2;
        --accent: #e50914;
        --live: #22c55e;
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); min-height: 100vh; }

      header {
        background: linear-gradient(135deg, #1a1d27, #2b1220);
        padding: 24px 20px;
        text-align: center;
        border-bottom: 3px solid var(--accent);
      }
      header h1 { font-size: 1.6rem; letter-spacing: 1px; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        align-items: center;
        padding: 16px;
        background: var(--card);
      }
      .toolbar select {
        background: var(--card2);
        color: var(--text);
        border: 1px solid #333949;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.95rem;
        outline: none;
        cursor: pointer;
      }
      .toolbar select:focus { border-color: var(--accent); }
      
      .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .chip {
        background: var(--card2);
        border: none;
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all .2s;
      }
      .chip.active { background: var(--accent); color: #fff; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .channel {
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #262b38;
      }
      .channel-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--card2);
      }
      .logo {
        width: 42px; height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.05rem;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
      }
      .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 10px; }
      .channel-head h2 { font-size: 1rem; }
      .channel-head .cat { font-size: .75rem; color: var(--muted); }

      .slot { display: flex; gap: 12px; padding: 10px 16px; border-top: 1px solid #262b38; }
      .slot time { color: var(--accent); font-weight: 600; font-size: 0.8rem; min-width: 95px; white-space: nowrap; }
      .slot .info { flex: 1; }
      .slot .title { font-size: 0.92rem; }
      .slot .genre { font-size: 0.75rem; color: var(--muted); }
      .slot.live { background: rgba(34,197,94,.08); }
      .slot.live .title::after {
        content: " ● EN DIRECT";
        color: var(--live);
        font-size: 0.65rem;
        letter-spacing: 1px;
      }
      .slot.past { opacity: .45; }

      footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 24px; }
      @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>

      <h1>Programme TNT</h1>
    </header>

    <div class="toolbar">
      <select id="daySelect"></select>
      <div class="chips" id="modeChips"></div>
    </div>

    <div class="grid" id="grid"></div>

    <footer>Programmes réels chargés depuis un guide XMLTV de la TNT (mise à jour chaque nuit). La variable <code>DATA</code> ne sert qu'en repli hors ligne.</footer>

    <script>

        ]},
        { name: "TF1 Séries Films", site: "tf1seriesfilms.fr", cat: "Cinéma / Séries", shows: [

          { time: "20:55", title: "Série : Le Grand Jour", genre: "Série" },
          { time: "22:30", title: "Film : Qu'est-ce qu'on a fait au Bon Dieu ?", genre: "Film" },
        ]},
        { name: "6ter", site: "6ter.fr", cat: "Généraliste", shows: [
          { time: "18:10", title: "Un jour, un doc", genre: "Documentaire" },
          { time: "20:45", title: "Film : Astérix et Obélix", genre: "Film" },
          { time: "22:40", title: "Mécaniques du monde", genre: "Documentaire" },
        ]},
        { name: "RéelsTV", site: "reelstv.fr", cat: "Documentaire", shows: [
          { time: "20:50", title: "Doc : Histoires vraies", genre: "Documentaire" },
          { time: "21:55", title: "Enquête de terrain", genre: "Documentaire" },
          { time: "23:00", title: "Le vrai du faux", genre: "Magazine" },
        ]},
        { name: "Gong", site: "gong.fr", cat: "Jeunesse", shows: [
          { time: "14:30", title: "Anime : Naruto", genre: "Jeunesse" },
          { time: "18:00", title: "Anime : One Piece", genre: "Jeunesse" },
          { time: "20:00", title: "Anime Movie : Your Name", genre: "Jeunesse" },
        ]},
      ];

      const now = new Date();
      const nowTs = now.getTime();
      const toMin = t => (+t.split(":")[0]) * 60 + (+t.split(":")[1]);
      const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
      function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
      function dateFromYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
      const todayStr = ymd(now);

      var todayStart = dateFromYmd(todayStr).getTime();
      DATA.forEach(function (c) { c.shows.forEach(function (s) {
        s.start = todayStart + toMin(s.time) * 60000;
        s.end = s.start + 90 * 60000;
      }); });

      var channels = DATA;
      var state = { mode: "now", date: todayStr };

      var BASE_URL = "https://raw.githubusercontent.com/Catch-up-TV-and-More/xmltv/master/";
      function apiUrl(dateStr) {
        return dateStr === todayStr
          ? BASE_URL + "tv_guide_fr_tnt.xml"
          : BASE_URL + "tv_guide_fr_" + dateStr.replace(/-/g, "") + ".xml";
      }
      function norm(n) {
        return (n || "").toLowerCase().replace(/[\s:._\-']/g, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }
      function elText(parent, tag, def) {
        var e = parent.getElementsByTagName(tag)[0];
        return e && e.textContent ? e.textContent.trim() : def;
      }
      var META = DATA;
      function metaFor(name) {
        var key = norm(name), i;
        for (i = 0; i < META.length; i++) if (norm(META[i].name) === key) return META[i];
        for (i = 0; i < META.length; i++) {
          if (key.indexOf(norm(META[i].name)) === 0 || norm(META[i].name).indexOf(key) === 0) return META[i];
        }
        return null;
      }

      // CORRECTION DÉFINITIVE : Force l'interprétation des heures du XMLTV directement en heure locale 
      // (en ignorant le décalage UTC du flux qui décale d'une heure)
      function parseXmltvDate(s) {
        if (!s) return null;
        var m = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
        if (!m) return null;
        var year = +m[1], month = +m[2] - 1, day = +m[3];
        var hour = +m[4], min = +m[5], sec = +m[6];
        
        // On construit directement la date en heure locale de l'appareil
        return new Date(year, month, day, hour, min, sec).getTime();
      }

      function loadPrograms() {
        var dayStart = dateFromYmd(state.date).getTime();
        var dayEnd = dayStart + 86400000;
        return fetch(apiUrl(state.date))
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (text) {
            var xml = new DOMParser().parseFromString(text, "application/xml");
            if (xml.getElementsByTagName("parsererror").length) throw new Error("XML invalide");
            var chs = xml.getElementsByTagName("channel"), infos = {};
            for (var i = 0; i < chs.length; i++) {
              var iconEl = chs[i].getElementsByTagName("icon")[0];
              infos[chs[i].getAttribute("id")] = {
                name: elText(chs[i], "display-name", chs[i].getAttribute("id")),
                icon: iconEl ? iconEl.getAttribute("src") : null
              };
            }
            var winStart = dayStart - 6 * 3600000, winEnd = dayEnd + 3 * 3600000;
            var byCh = {}, progs = xml.getElementsByTagName("programme");
            for (var k = 0; k < progs.length; k++) {
              var p = progs[k];
              var info = infos[p.getAttribute("channel")];
              if (!info) continue;
              var meta = metaFor(info.name);
              if (!meta) continue;
              var start = parseXmltvDate(p.getAttribute("start"));
              if (start === null) continue;
              var end = parseXmltvDate(p.getAttribute("stop"));
              if (end === null) end = start + 2 * 3600000;
              if (!(start < winEnd && end > winStart)) continue;
              if (!byCh[info.name]) {
                byCh[info.name] = { name: info.name, icon: info.icon, logo: meta.logo, cat: meta.cat, site: meta.site, shows: [] };
              }
              byCh[info.name].shows.push({
                time: hhmm(start), start: start, end: end,
                title: elText(p, "title", "Programme"),
                genre: elText(p, "category", "Programme")
              });
            }
            var list = [], key2;
            for (key2 in byCh) list.push(byCh[key2]);
            if (!list.length) throw new Error("aucun programme");
            list.sort(function (a, b) {
              var ra = 99, rb = 99;
              for (var m2 = 0; m2 < META.length; m2++) {
                if (norm(META[m2].name) === norm(a.name)) ra = m2;
                if (norm(META[m2].name) === norm(b.name)) rb = m2;
              }
              return ra - rb;
            });
            list.forEach(function (c) { c.shows.sort(function (a, b) { return a.start - b.start; }); });
            channels = list;
          })
          .catch(function () {
            if (state.date === todayStr) channels = DATA;
            else channels = [];
          })
          .then(function () { buildModeChips(); render(); });
      }

      function buildDaySelect() {
        var sel = document.getElementById("daySelect");
        sel.innerHTML = "";
        for (var i = 0; i < 7; i++) {
          var dStr = ymd(new Date(todayStart + i * 86400000));
          var label;
          if (i === 0) label = "Aujourd'hui";
          else if (i === 1) label = "Demain";
          else {
            var wd = dateFromYmd(dStr).toLocaleDateString("fr-FR", { weekday: "long" });
            label = wd.charAt(0).toUpperCase() + wd.slice(1);
          }
          var opt = document.createElement("option");
          opt.value = dStr;
          opt.textContent = label;
          if (dStr === state.date) opt.selected = true;
          sel.appendChild(opt);
        }
        sel.onchange = function (e) {
          state.date = e.target.value;
          if (state.date !== todayStr && state.mode === "now") {
            state.mode = "day";
          }
          buildModeChips();
          loadPrograms();
        };
      }

      function buildModeChips() {
        var box = document.getElementById("modeChips");
        box.innerHTML = "";
        var isToday = state.date === todayStr;
        if (!isToday && state.mode === "now") state.mode = "day";
        
        var modes = [];
        if (isToday) modes.push({ id: "now", label: "En ce moment" });
        modes.push({ id: "evening", label: "Ce soir" });
        modes.push({ id: "day", label: "Toute la journée" });

        modes.forEach(function (m) {
          var b = document.createElement("button");
          b.className = "chip" + (m.id === state.mode ? " active" : "");
          b.textContent = m.label;
          b.dataset.mode = m.id;
          b.onclick = function () {
            state.mode = this.dataset.mode;
            var siblings = box.children;
            for (var s = 0; s < siblings.length; s++) siblings[s].classList.toggle("active", siblings[s] === this);
            render();
          };
          box.appendChild(b);
        });
      }

      function render() {
        var grid = document.getElementById("grid");
        grid.innerHTML = "";
        var any = false;
        var dayStart = dateFromYmd(state.date).getTime();
        var dayEnd = dayStart + 86400000;
        var eveStart = dayStart + (20 * 3600000 + 45 * 60000); 
        var eveEnd = dayStart + 30 * 3600000;

        channels.forEach(function (c) {
          var shows = c.shows
            .slice()
            .sort(function (a, b) { return a.start - b.start; });
          if (state.mode === "now") {
            var idx = -1;
            for (var s2 = 0; s2 < shows.length; s2++) {
              if (shows[s2].start <= nowTs && nowTs < shows[s2].end) { idx = s2; break; }
            }
            if (idx < 0) {
              shows = shows.filter(function (s) { return s.start > nowTs; }).slice(0, 3);
            } else {
              shows = shows.slice(Math.max(0, idx - 1), idx + 3);
            }
          } else if (state.mode === "evening") {
            shows = shows.filter(function (s) { return s.start >= eveStart && s.start < eveEnd; });
          } else {
            shows = shows.filter(function (s) { return s.end > dayStart && s.start < dayEnd; });
          }
          if (!shows.length) return;
          any = true;
          var card = document.createElement("div");
          card.className = "channel";
          card.innerHTML =
            '<div class="channel-head">' +
              '<div class="logo" style="background:' + c.logo + '"><span class="init">' + c.name.slice(0, 2) + "</span></div>" +
              '<div><h2>' + c.name + '</h2><div class="cat">' + c.cat + '</div></div>' +
            '</div>';
          var logoBox = card.querySelector(".logo");
          var img = document.createElement("img");
          img.alt = "Logo " + c.name;
          img.loading = "lazy";
          img.src = c.icon || ("https://logo.clearbit.com/" + c.site + "?size=84");
          img.onload = function () {
            var sp = logoBox.querySelector(".init");
            if (sp) sp.style.display = "none";
          };
          img.onerror = function () {
            if (c.site) {
              img.onerror = function () { img.remove(); };
              img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + c.site;
            } else img.remove();
          };
          logoBox.appendChild(img);
          shows.forEach(function (s) {
            var live = s.start <= nowTs && nowTs < s.end;
            var past = s.end <= nowTs;
            var row = document.createElement("div");
            row.className = "slot" + (live ? " live" : "") + (past ? " past" : "");
            
            var timeFormatted = s.time + " - " + hhmm(s.end);

            row.innerHTML = "<time>" + timeFormatted + "</time>" +
              '<div class="info"><div class="title">' + s.title + '</div><div class="genre">' + s.genre + "</div></div>";
            card.appendChild(row);
          });
          grid.appendChild(card);
        });
        if (!any) grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;color:#9aa3b2;padding:40px'>Aucune émission trouvée.</p>";
      }
      
      buildDaySelect();
      buildModeChips();
      render();
      loadPrograms();
    </script>
  </body>
</html>
