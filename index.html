    <meta charset="UTF-8" />

    <title>Programme TNT</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --card2: #222633;
        --text: #eef1f6;
        --muted: #9aa3b2;
        --accent: #38bdf8; /* Remplacé par un bleu doux et élégant */
        --live: #22c55e;
        color-scheme: dark;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); min-height: 100vh; }

      /* En-tête ultra compact */
      header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        padding: 8px 16px;
        border-bottom: 1px solid #262b38;
        gap: 10px;
      }
      header h1 { font-size: 1.1rem; letter-spacing: 0.5px; }

      .toolbar {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .toolbar select {
        background: var(--card2);
        color: var(--text);
        border: 1px solid #333949;
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 0.8rem;
        outline: none;
        cursor: pointer;
      }
      .toolbar select:focus { border-color: var(--accent); }
      
      .chips { display: flex; gap: 4px; }
      .chip {
        background: var(--card2);
        border: none;
        color: var(--muted);
        padding: 5px 10px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.75rem;
        transition: all .2s;
      }
      .chip.active { background: var(--accent); color: #0f1117; font-weight: 600; }

      /* Effet Reveal au scroll (état initial caché) */
      .channel {
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #262b38;
      }

      /* État visible lorsque l'élément entre à l'écran */
      .channel.revealed {
        opacity: 1;
        transform: translateY(0);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
        padding: 16px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .channel-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--card2);
      }
      .logo {
        width: 36px; height: 36px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 0.95rem;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
      }
      .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 8px; }
      .channel-head h2 { font-size: 0.95rem; }
      .channel-head .cat { font-size: .7rem; color: var(--muted); }

      .slot { 
        display: flex; 
        gap: 12px; 
        padding: 10px 14px; 
        border-top: 1px solid #262b38; 
        cursor: pointer; 
        transition: background 0.15s;
      }
      .slot:hover { background: rgba(56, 189, 248, 0.05); }
      .slot time { color: var(--accent); font-weight: 600; font-size: 0.8rem; min-width: 95px; white-space: nowrap; }
      .slot .info { flex: 1; }
      .slot .title { font-size: 0.9rem; margin-bottom: 2px; }
      
      .slot .meta-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .slot .season { font-size: 0.75rem; color: var(--muted); }

      .slot.live { background: rgba(34,197,94,.08); }
      .slot.live .title::after {
        content: " ● EN DIRECT";
        color: var(--live);
        font-size: 0.6rem;
        letter-spacing: 1px;
      }
      .slot.past { opacity: .45; }

      /* Modale de synopsis */
      .modal-backdrop {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
        z-index: 1000; padding: 20px; backdrop-filter: blur(4px);
      }
      .modal-backdrop.open { display: flex; }
      .modal {
        background: var(--card); border: 1px solid #333949; border-radius: 14px;
        width: 100%; max-width: 500px; padding: 24px; position: relative;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
      .modal h3 { font-size: 1.2rem; margin-bottom: 6px; }
      .modal .modal-time { color: var(--accent); font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
      .modal .modal-desc { font-size: 0.95rem; color: var(--muted); line-height: 1.5; margin-top: 12px; max-height: 60vh; overflow-y: auto; }
      .modal-close {
        position: absolute; top: 16px; right: 16px; background: var(--card2); border: none;
        color: var(--text); width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
        font-weight: bold; display: flex; align-items: center; justify-content: center;
      }
      .modal-close:hover { background: var(--accent); color: #0f1117; }

      @media (max-width: 600px) { 
        header { flex-direction: column; align-items: stretch; text-align: center; }
        .toolbar { justify-content: center; flex-wrap: wrap; }
        .grid { grid-template-columns: 1fr; } 
      }
    </style>
  </head>

      function ymd(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
      function dateFromYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }

        return dateStr === todayStr
          ? BASE_URL + "tv_guide_fr_tnt.xml"

      function norm(n) {
        return (n || "").toLowerCase().replace(/[\s:._\-']/g, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }
      function elText(parent, tag, def) {
        var e = parent.getElementsByTagName(tag)[0];
        return e && e.textContent ? e.textContent.trim() : def;
      }
      var META = DATA;
      function metaFor(name) {
        var key = norm(name), i;
        for (i = 0; i < META.length; i++) if (norm(META[i].name) === key) return META[i];
        for (i = 0; i < META.length; i++) {
          if (key.indexOf(norm(META[i].name)) === 0 || norm(META[i].name).indexOf(key) === 0) return META[i];
        }
        return null;
      }

      function parseXmltvDate(s) {
        if (!s) return null;
        var m = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
        if (!m) return null;
        var year = +m[1], month = +m[2] - 1, day = +m[3];
        var hour = +m[4], min = +m[5], sec = +m[6];
        return new Date(year, month, day, hour, min, sec).getTime();
      }

      function parseEpisode(progEl) {
        var epNums = progEl.getElementsByTagName("episode-num");
        for (var i = 0; i < epNums.length; i++) {
          var system = epNums[i].getAttribute("system");
          var val = epNums[i].textContent.trim();
          if (system === "xmltv_ns") {
            var parts = val.split(".");
            if (parts.length >= 2 && parts[0] !== "" && parts[1] !== "") {
              var s = parseInt(parts[0], 10);
              var e = parseInt(parts[1], 10);
              if (!isNaN(s) && !isNaN(e)) {
                return "S" + String(s + 1).padStart(2, "0") + "E" + String(e + 1).padStart(2, "0");
              }
            }
          } else if (system === "onscreen" || !system) {
            var match = val.match(/S(\d+)[\s\w]*E(\d+)/i) || val.match(/(\d+)x(\d+)/);
            if (match) {
              return "S" + String(match[1]).padStart(2, "0") + "E" + String(match[2]).padStart(2, "0");
            }
          }
        }
        return null;
      }

        return fetch(apiUrl(state.date))

            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (text) {
            var xml = new DOMParser().parseFromString(text, "application/xml");
            if (xml.getElementsByTagName("parsererror").length) throw new Error("XML invalide");
            var chs = xml.getElementsByTagName("channel"), infos = {};
            for (var i = 0; i < chs.length; i++) {
              var iconEl = chs[i].getElementsByTagName("icon")[0];
              infos[chs[i].getAttribute("id")] = {
                name: elText(chs[i], "display-name", chs[i].getAttribute("id")),
                icon: iconEl ? iconEl.getAttribute("src") : null
              };
            }
            var winStart = dayStart - 6 * 3600000, winEnd = dayEnd + 3 * 3600000;
            var byCh = {}, progs = xml.getElementsByTagName("programme");
            for (var k = 0; k < progs.length; k++) {
              var p = progs[k];
              var info = infos[p.getAttribute("channel")];
              if (!info) continue;
              var meta = metaFor(info.name);
              if (!meta) continue;
              var start = parseXmltvDate(p.getAttribute("start"));
              if (start === null) continue;
              var end = parseXmltvDate(p.getAttribute("stop"));
              if (end === null) end = start + 2 * 3600000;
              if (!(start < winEnd && end > winStart)) continue;
              if (!byCh[info.name]) {
                byCh[info.name] = { name: info.name, icon: info.icon, logo: meta.logo, cat: meta.cat, site: meta.site, shows: [] };
              }
              byCh[info.name].shows.push({
                time: hhmm(start), start: start, end: end,
                title: elText(p, "title", "Programme"),
                genre: elText(p, "category", "Programme"),
                desc: elText(p, "desc", "Aucun résumé disponible pour cette émission."),
                episode: parseEpisode(p)
              });
            }
            var list = [], key2;
            for (key2 in byCh) list.push(byCh[key2]);
            if (!list.length) throw new Error("aucun programme");
            list.sort(function (a, b) {
              var ra = 99, rb = 99;
              for (var m2 = 0; m2 < META.length; m2++) {
                if (norm(META[m2].name) === norm(a.name)) ra = m2;
                if (norm(META[m2].name) === norm(b.name)) rb = m2;
              }
              return ra - rb;
            });
            list.forEach(function (c) { c.shows.sort(function (a, b) { return a.start - b.start; }); });
            channels = list;
          })
          .catch(function () {
            if (state.date === todayStr) channels = DATA;
            else channels = [];
          })
          .then(function () { buildModeChips(); render(); });
      }

      function buildDaySelect() {
        var sel = document.getElementById("daySelect");
        sel.innerHTML = "";
        for (var i = 0; i < 7; i++) {
          var dStr = ymd(new Date(todayStart + i * 86400000));
          var label;
          if (i === 0) label = "Aujourd'hui";
          else if (i === 1) label = "Demain";
          else {
            var wd = dateFromYmd(dStr).toLocaleDateString("fr-FR", { weekday: "long" });
            label = wd.charAt(0).toUpperCase() + wd.slice(1);
          }
          var opt = document.createElement("option");
          opt.value = dStr;
          opt.textContent = label;
          if (dStr === state.date) opt.selected = true;
          sel.appendChild(opt);
        }
        sel.onchange = function (e) {
          state.date = e.target.value;
          if (state.date !== todayStr && state.mode === "now") {
            state.mode = "day";
          }
          buildModeChips();
          loadPrograms();
        };
      }

      function buildModeChips() {
        var box = document.getElementById("modeChips");
        box.innerHTML = "";
        var isToday = state.date === todayStr;
        if (!isToday && state.mode === "now") state.mode = "day";
        
        var modes = [];
        if (isToday) modes.push({ id: "now", label: "En ce moment" });
        modes.push({ id: "evening", label: "Ce soir" });
        modes.push({ id: "day", label: "Toute la journée" });

        modes.forEach(function (m) {
          var b = document.createElement("button");
          b.className = "chip" + (m.id === state.mode ? " active" : "");
          b.textContent = m.label;
          b.dataset.mode = m.id;
          b.onclick = function () {
            state.mode = this.dataset.mode;
            var siblings = box.children;
            for (var s = 0; s < siblings.length; s++) siblings[s].classList.toggle("active", siblings[s] === this);
            render();
          };
          box.appendChild(b);
        });
      }

      function openModal(channelName, show) {
        document.getElementById("modalChan").textContent = channelName;
        document.getElementById("modalTitle").textContent = show.title;
        document.getElementById("modalTime").textContent = show.time + " - " + hhmm(show.end);
        document.getElementById("modalGenre").textContent = "Genre : " + (show.genre || "Non spécifié") + (show.episode ? " — " + show.episode : "");
        document.getElementById("modalDesc").textContent = show.desc;
        document.getElementById("modalBackdrop").classList.add("open");
      }

      document.getElementById("modalClose").onclick = function() {
        document.getElementById("modalBackdrop").classList.remove("open");
      };
      document.getElementById("modalBackdrop").onclick = function(e) {
        if (e.target === this) this.classList.remove("open");
      };

      function initScrollReveal() {
        var observer = new IntersectionObserver(function(entries, observer) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("revealed");
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        document.querySelectorAll(".channel").forEach(function(card) {
          observer.observe(card);
        });
      }

      function render() {
        var grid = document.getElementById("grid");
        grid.innerHTML = "";
        var any = false;
        var dayStart = dateFromYmd(state.date).getTime();
        var dayEnd = dayStart + 86400000;
        var eveStart = dayStart + (20 * 3600000 + 45 * 60000); 
        var eveEnd = dayStart + 30 * 3600000;

        channels.forEach(function (c) {
          var shows = c.shows
            .slice()
            .sort(function (a, b) { return a.start - b.start; });
          if (state.mode === "now") {
            var idx = -1;
            for (var s2 = 0; s2 < shows.length; s2++) {
              if (shows[s2].start <= nowTs && nowTs < shows[s2].end) { idx = s2; break; }
            }
            if (idx < 0) {
              shows = shows.filter(function (s) { return s.start > nowTs; }).slice(0, 3);
            } else {
              shows = shows.slice(Math.max(0, idx - 1), idx + 3);
            }
          } else if (state.mode === "evening") {
            shows = shows.filter(function (s) { return s.start >= eveStart && s.start < eveEnd; });
          } else {
            shows = shows.filter(function (s) { return s.end > dayStart && s.start < dayEnd; });
          }
          if (!shows.length) return;
          any = true;
          var card = document.createElement("div");
          card.className = "channel";
          card.innerHTML =
            '<div class="channel-head">' +
              '<div class="logo" style="background:' + c.logo + '"><span class="init">' + c.name.slice(0, 2) + "</span></div>" +
              '<div><h2>' + c.name + '</h2><div class="cat">' + c.cat + '</div></div>' +
            '</div>';
          var logoBox = card.querySelector(".logo");
          var img = document.createElement("img");
          img.alt = "Logo " + c.name;
          img.loading = "lazy";
          img.src = c.icon || ("https://logo.clearbit.com/" + c.site + "?size=84");
          img.onload = function () {
            var sp = logoBox.querySelector(".init");
            if (sp) sp.style.display = "none";
          };
          img.onerror = function () {
            if (c.site) {
              img.onerror = function () { img.remove(); };
              img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + c.site;
            } else img.remove();
          };
          logoBox.appendChild(img);

          shows.forEach(function (s) {
            var live = s.start <= nowTs && nowTs < s.end;
            var past = s.end <= nowTs;
            var row = document.createElement("div");
            row.className = "slot" + (live ? " live" : "") + (past ? " past" : "");
            
            var timeFormatted = s.time + " - " + hhmm(s.end);
            var epHtml = s.episode ? '<span class="season">' + s.episode + '</span>' : '';

            row.innerHTML = "<time>" + timeFormatted + "</time>" +
              '<div class="info">' +
                '<div class="title">' + s.title + '</div>' +
                '<div class="meta-row"><span class="genre">' + s.genre + '</span>' + epHtml + '</div>' +
              '</div>';
            
            row.onclick = function() { openModal(c.name, s); };
            card.appendChild(row);
          });
          grid.appendChild(card);
        });

        if (!any) {
          grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;color:#9aa3b2;padding:40px'>Aucune émission trouvée.</p>";
        } else {
          initScrollReveal();
        }
      }
      
      buildDaySelect();
      buildModeChips();
      render();
      loadPrograms();
    </script>
  </body>
</html>
