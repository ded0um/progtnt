<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Programme TV</title>
    <style>
      :root {
        --bg: #0f1117;
        --card: #1a1d27;
        --card2: #222633;
        --text: #eef1f6;
        --muted: #9aa3b2;
        --accent: #e50914;
        --live: #22c55e;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: var(--bg); color: var(--text); min-height: 100vh; }

      header {
        background: linear-gradient(135deg, #1a1d27, #2b1220);
        padding: 24px 20px;
        text-align: center;
        border-bottom: 3px solid var(--accent);
      }
      header h1 { font-size: 1.6rem; letter-spacing: 1px; }
      header p { color: var(--muted); margin-top: 4px; font-size: 0.9rem; }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        padding: 16px;
        background: var(--card);
      }
      .toolbar input, .toolbar select {
        background: var(--card2);
        color: var(--text);
        border: 1px solid #33394900;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.95rem;
        outline: none;
      }
      .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
      .chip {
        background: var(--card2);
        border: none;
        color: var(--muted);
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all .2s;
      }
      .chip.active { background: var(--accent); color: #fff; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
        padding: 20px;
        max-width: 1200px;
        margin: 0 auto;
      }
      .channel {
        background: var(--card);
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #262b38;
      }
      .channel-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        background: var(--card2);
      }
      .logo {
        width: 42px; height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 1.05rem;
        color: #fff;
        flex-shrink: 0;
        overflow: hidden;
      }
      .logo img { width: 100%; height: 100%; object-fit: contain; background: #fff; border-radius: 10px; }
      .channel-head h2 { font-size: 1rem; }
      .channel-head .cat { font-size: .75rem; color: var(--muted); }

      .slot { display: flex; gap: 12px; padding: 10px 16px; border-top: 1px solid #262b38; }
      .slot time { color: var(--accent); font-weight: 600; font-size: 0.85rem; min-width: 44px; }
      .slot .info { flex: 1; }
      .slot .title { font-size: 0.92rem; }
      .slot .genre { font-size: 0.75rem; color: var(--muted); }
      .slot.live { background: rgba(34,197,94,.08); }
      .slot.live .title::after {
        content: " ● EN DIRECT";
        color: var(--live);
        font-size: 0.65rem;
        letter-spacing: 1px;
      }
      .slot.past { opacity: .45; }

      footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 24px; }
      @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>

      <h1>📺 Programme TV</h1>
      <p id="today"></p>
      <p id="source" style="font-size:.8rem;margin-top:6px">Chargement des programmes…</p>
    </header>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Rechercher une émission…" />
      <div class="chips" id="categories"></div>
      <select id="nowFilter">
        <option value="all">Tout le programme</option>
        <option value="now">En cours actuellement</option>
      </select>
    </div>

    <div class="grid" id="grid"></div>

    <footer>Programmes réels chargés depuis un guide XMLTV de la TNT (mise à jour chaque nuit). La variable <code>DATA</code> ne sert qu'en repli hors ligne.</footer>

        ]},
        { name: "TF1 Séries Films", logo: "#3f51b5", site: "tf1seriesfilms.fr", cat: "Cinéma / Séries", shows: [
          { time: "15:00", title: "Série : Camping Paradis", genre: "Série" },
          { time: "20:55", title: "Série : Le Grand Jour", genre: "Série" },
          { time: "22:30", title: "Film : Qu'est-ce qu'on a fait au Bon Dieu ?", genre: "Film" },
        ]},
        { name: "6ter", logo: "#00bcd4", site: "6ter.fr", cat: "Généraliste", shows: [
          { time: "18:10", title: "Un jour, un doc", genre: "Documentaire" },
          { time: "20:45", title: "Film : Astérix et Obélix", genre: "Film" },
          { time: "22:40", title: "Mécaniques du monde", genre: "Documentaire" },
        ]},
        { name: "RéelsTV", logo: "#e91e63", site: "reelstv.fr", cat: "Documentaire", shows: [
          { time: "20:50", title: "Doc : Histoires vraies", genre: "Documentaire" },
          { time: "21:55", title: "Enquête de terrain", genre: "Documentaire" },
          { time: "23:00", title: "Le vrai du faux", genre: "Magazine" },
        ]},
        { name: "Gong", logo: "#607d8b", site: "gong.fr", cat: "Jeunesse", shows: [
          { time: "14:30", title: "Anime : Naruto", genre: "Jeunesse" },
          { time: "18:00", title: "Anime : One Piece", genre: "Jeunesse" },
          { time: "20:00", title: "Anime Movie : Your Name", genre: "Jeunesse" },
        ]},
      ];

      const now = new Date();
      const nowTs = now.getTime();
      const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const dayEnd = dayStart + 86400000;
      const toMin = t => (+t.split(":")[0]) * 60 + (+t.split(":")[1]);
      const hhmm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };

      // Affiche toute erreur JS dans le badge (diagnostic)
      window.onerror = function (msg) {
        var b = document.getElementById("source");
        if (b) { b.textContent = "⚠ Erreur : " + msg; b.style.color = "#ef4444"; }
      };

      // Le repli (données d'exemple) reçoit des horodatages plausibles
      DATA.forEach(function (c) { c.shows.forEach(function (s) {
        s.start = dayStart + toMin(s.time) * 60000;
        s.end = s.start + 90 * 60000;
      }); });

      var channels = DATA; // remplacé par les vrais programmes si l'API répond
      var state = { q: "", cat: "Toutes", mode: "all" };

      document.getElementById("today").textContent =
        now.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

      // ===== Vrais programmes : guide XMLTV de la TNT, mis à jour chaque nuit =====
      const API_URL = "https://raw.githubusercontent.com/Catch-up-TV-and-More/xmltv/master/tv_guide_fr_tnt.xml";
      function norm(n) {
        return (n || "").toLowerCase().replace(/[\s:._\-']/g, "").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      }
      function elText(parent, tag, def) {
        var e = parent.getElementsByTagName(tag)[0];
        return e && e.textContent ? e.textContent.trim() : def;
      }
      var META = DATA; // couleurs + catégories connues
      function metaFor(name) {
        var key = norm(name);
        for (var i = 0; i < META.length; i++) {
          if (norm(META[i].name) === key) return META[i];
        }
        for (var j = 0; j < META.length; j++) {
          if (key.indexOf(norm(META[j].name)) === 0 || norm(META[j].name).indexOf(key) === 0) return META[j];
        }
        return { name: name, logo: "#334155", cat: "TNT", site: null };
      }
      function parseXmltvDate(s) {
        var m = (s || "").match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})/);
        return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime() : null;
      }

      function loadPrograms() {
        var badge = document.getElementById("source");
        return fetch(API_URL)
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (text) {
            var xml = new DOMParser().parseFromString(text, "application/xml");
            if (xml.getElementsByTagName("parsererror").length) throw new Error("XML invalide");
            var chs = xml.getElementsByTagName("channel"), infos = {};
            for (var i = 0; i < chs.length; i++) {
              var iconEl = chs[i].getElementsByTagName("icon")[0];
              infos[chs[i].getAttribute("id")] = {
                name: elText(chs[i], "display-name", chs[i].getAttribute("id")),
                icon: iconEl ? iconEl.getAttribute("src") : null
              };
            }
            var byCh = {}, progs = xml.getElementsByTagName("programme");
            for (var k = 0; k < progs.length; k++) {
              var p = progs[k];
              var info = infos[p.getAttribute("channel")];
              if (!info) continue;
              var start = parseXmltvDate(p.getAttribute("start"));
              if (start === null) continue;
              var end = parseXmltvDate(p.getAttribute("stop"));
              if (end === null) end = start + 2 * 3600000;
              if (!(start < dayEnd && end > dayStart)) continue; // programmes d'aujourd'hui
              var meta = metaFor(info.name);
              if (!byCh[info.name]) {
                byCh[info.name] = { name: info.name, icon: info.icon, logo: meta.logo, cat: meta.cat, site: meta.site, shows: [] };
              }
              byCh[info.name].shows.push({
                time: hhmm(start), start: start, end: end,
                title: elText(p, "title", "Programme"),
                genre: elText(p, "category", "Programme")
              });
            }
            var list = [], key2;
            for (key2 in byCh) list.push(byCh[key2]);
            if (!list.length) throw new Error("aucun programme aujourd'hui");
            // Ordre TNT : celui de META, les inconnues à la fin
            list.sort(function (a, b) {
              var ra = 99, rb = 99;
              for (var m2 = 0; m2 < META.length; m2++) {
                if (norm(META[m2].name) === norm(a.name)) ra = m2;
                if (norm(META[m2].name) === norm(b.name)) rb = m2;
              }
              return ra - rb;
            });
            channels = list;
            badge.textContent = "● Programmes réels — guide XMLTV mis à jour chaque nuit";
            badge.style.color = "#22c55e";
          })
          .catch(function (e) {
            badge.textContent = "○ Hors ligne — affichage des données d'exemple (" + e.message + ")";
            badge.style.color = "#f59e0b";
          })
          .then(function () { buildChips(); render(); });
      }

      function buildChips() {
        var catBox = document.getElementById("categories");
        catBox.innerHTML = "";
        var cats = ["Toutes"], i;
        for (i = 0; i < channels.length; i++) if (cats.indexOf(channels[i].cat) < 0) cats.push(channels[i].cat);
        cats.forEach(function (c) {
          var b = document.createElement("button");
          b.className = "chip" + (c === state.cat ? " active" : "");
          b.textContent = c;
          b.onclick = function () {
            state.cat = c;
            var siblings = catBox.children;
            for (var s = 0; s < siblings.length; s++) siblings[s].classList.toggle("active", siblings[s] === b);
            render();
          };
          catBox.appendChild(b);
        });
      }

      document.getElementById("search").oninput = function (e) { state.q = e.target.value.toLowerCase(); render(); };
      document.getElementById("nowFilter").onchange = function (e) { state.mode = e.target.value; render(); };

      function render() {
        var grid = document.getElementById("grid");
        grid.innerHTML = "";
        var any = false;
        channels.forEach(function (c) {
          if (state.cat !== "Toutes" && c.cat !== state.cat) return;
          var shows = c.shows
            .slice()
            .sort(function (a, b) { return a.start - b.start; })
            .filter(function (s) { return s.title.toLowerCase().indexOf(state.q) >= 0 || s.genre.toLowerCase().indexOf(state.q) >= 0; })
            .filter(function (s) { return state.mode === "all" || (s.start <= nowTs && nowTs < s.end); });
          if (!shows.length) return;
          any = true;
          var card = document.createElement("div");
          card.className = "channel";
          card.innerHTML =
            '<div class="channel-head">' +
              '<div class="logo" style="background:' + c.logo + '">' + c.name.slice(0, 2) + '</div>' +
              '<div><h2>' + c.name + '</h2><div class="cat">' + c.cat + '</div></div>' +
            '</div>';
          // Vrai logo : logo officiel du guide, puis Clearbit, puis favicon, puis initiales
          var logoBox = card.querySelector(".logo");
          var img = document.createElement("img");
          img.alt = "Logo " + c.name;
          img.loading = "lazy";
          img.src = c.icon || ("https://logo.clearbit.com/" + c.site + "?size=84");
          img.onerror = function () {
            if (c.site) {
              img.onerror = function () { img.remove(); }; // garde les initiales
              img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + c.site;
            } else img.remove();
          };
          logoBox.appendChild(img);
          shows.forEach(function (s) {
            var live = s.start <= nowTs && nowTs < s.end;
            var past = s.end <= nowTs;
            var row = document.createElement("div");
            row.className = "slot" + (live ? " live" : "") + (past ? " past" : "");
            row.innerHTML = "<time>" + s.time + "</time>" +
              '<div class="info"><div class="title">' + s.title + '</div><div class="genre">' + s.genre + "</div></div>";
            card.appendChild(row);
          });
          grid.appendChild(card);
        });
        if (!any) grid.innerHTML = "<p style='grid-column:1/-1;text-align:center;color:#9aa3b2;padding:40px'>Aucune émission trouvée.</p>";
      }
      buildChips();
      render();
      loadPrograms();
    </script>
  </body>
</html>
